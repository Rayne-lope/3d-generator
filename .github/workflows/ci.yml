name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests + golden suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Same Chromium build as Playwright 1.56.1 everywhere: renders (parity, golden baselines)
      # use its SwiftShader WebGL, so they are deterministic across machines.
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: node studio doctor
      - run: node studio golden
      - name: Upload golden report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-report
          path: golden/report
          if-no-files-found: ignore

  godot:
    name: Godot import check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          echo "GODOT_BIN=$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - run: node studio engine-verify godot
      - name: Upload Godot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-report
          path: engines/godot/verify/report.json
          if-no-files-found: ignore
