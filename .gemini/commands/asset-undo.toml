# Generated from .agents/skills/asset-undo/SKILL.md by `node studio agents`. Edit that file, not this one.
description = "Undo the last change to a studio asset or set by restoring the previous saved version (unsaved work is auto-saved first, so nothing is lost). Use when the user wants to go back, undo, revert or restore an earlier version of an asset."
prompt = '''
Request: {{args}}

# Undo the last change

Input: an asset slug or `set:<name>`.

1. `node studio history <target>` to see where the working copy stands.
2. `node studio undo <target>`. With unsaved changes it returns to the last saved version
   (the changes are auto-saved first); otherwise it returns to the version the current one was
   made from. Every step can be reversed with `node studio revert <target> <vNNN>`.
3. `node studio diff <target> <the version you left> working` and open the diff sheet with your
   image tool to confirm what was rolled back.
4. Reply: which version is restored now (its message), what was undone, and how to get it back.
'''
